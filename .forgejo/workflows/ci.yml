# Job names are load-bearing: branch protection references them as "CI / <job> (*)".
# Fully-qualify every `uses:` to github.com — bare names mis-resolve to data.forgejo.org.
# gitleaks runs from a pinned binary; the gitleaks-action calls the GitHub API and fails here.
# `pull_request:` stays unfiltered — a required check on a path-filtered workflow never
# reports, and automerge reads a never-reported check as passing.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner .
